services:
  minio:
    image: pgsty/silo:latest
    container_name: toeic-minio
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/minio/health/live || wget -q -O - http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: pgsty/silo:latest
    container_name: toeic-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-toeic-media}
    volumes:
      - ./docker/minio-seed:/seed:ro
    entrypoint: >
      /bin/sh -c "
      CLI=$$(command -v mcli || command -v mc) &&
      $$CLI alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" &&
      $$CLI mb --ignore-existing local/\"$${MINIO_BUCKET}\" &&
      if [ -d /seed ] && [ \"$$(ls -A /seed 2>/dev/null)\" ]; then
        $$CLI cp --recursive /seed/ local/\"$${MINIO_BUCKET}\"/;
      fi
      "

volumes:
  minio_data:
