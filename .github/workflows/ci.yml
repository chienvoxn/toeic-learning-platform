name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-rag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      pgvector:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: toeic_ai_test
          POSTGRES_USER: postgres
          # Ephemeral local CI database; no application credentials are used.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d toeic_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://postgres@localhost:5433/toeic_ai_test
    defaults:
      run:
        working-directory: AI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: AI/requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e ".[dev]" --no-deps
      - run: python -m ruff check --no-cache app migrations tests scripts
      - run: python -m ruff format --no-cache --check app migrations tests scripts
      - name: Unit and real pgvector integration tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: toeic_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d toeic_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_PASSWORD: ci_test_password
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/toeic_db
      SPRING_DATASOURCE_USERNAME: postgres

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests
        run: mvn -B clean verify
