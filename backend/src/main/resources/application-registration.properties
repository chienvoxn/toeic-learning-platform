# OTP is used only for forgotten-password recovery; expires after 5 minutes
app.password-reset.otp-ttl-seconds=300
app.password-reset.max-attempts=5
app.password-reset.resend-cooldown-seconds=60
app.password-reset.mail-from=${MAIL_FROM:noreply@toeic.local}

# Local SMTP configuration
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:false}

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
