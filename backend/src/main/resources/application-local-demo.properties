# Opt-in local demo only. The normal datasource/profile is unchanged.
spring.datasource.url=jdbc:postgresql://127.0.0.1:55459/toeic_learning_demo
spring.datasource.username=toeic_demo
spring.datasource.password=${DEMO_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
server.address=127.0.0.1
server.port=8080
spring.mail.host=127.0.0.1
spring.mail.port=1025
# Keep local Mailpit HELO deterministic; reverse DNS can outlive the browser timeout.
spring.mail.properties.mail.smtp.localhost=localhost
# Message-ID generation uses mail.host separately from SMTP HELO.
spring.mail.properties.mail.host=localhost
