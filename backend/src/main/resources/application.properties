spring.application.name=toeic-backend
server.port=8080
vocabulary.ml.model-path=${VOCABULARY_ML_MODEL_PATH:../ml/vocabulary/vocabulary_model.json}
# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/toeic_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.config.import=classpath:application-registration.properties

# Opaque bearer sessions; no refresh token in this flow.
app.auth.session-ttl-seconds=${AUTH_SESSION_TTL_SECONDS:900}
