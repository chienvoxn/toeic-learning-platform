spring.application.name=toeic-backend
server.port=8080
vocabulary.ml.model-path=${VOCABULARY_ML_MODEL_PATH:../ml/vocabulary/vocabulary_model.json}
# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/toeic_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.sql.init.mode=never
# The coordinator owns historical locations and validates every applied migration.
# Empty databases and a verified V33 prefix follow the canonical RAG lineage.
app.migrations.mode=migrate
app.migrations.lock-timeout-ms=30000

spring.config.import=classpath:application-registration.properties

# Opaque bearer sessions; no refresh token in this flow.
app.auth.session-ttl-seconds=${AUTH_SESSION_TTL_SECONDS:900}
app.auth.google.client-id=${GOOGLE_CLIENT_ID:}
app.auth.google.secure-cookie=${GOOGLE_SECURE_COOKIE:false}

# RAG service. The same internal keys are configured in AI/.env; the Gemini key
# remains in the Python service and is never exposed to Spring or the browser.
app.ai.base-url=${PYTHON_RAG_BASE_URL:${AI_BASE_URL:http://127.0.0.1:8001}}
app.ai.service-key=${AI_SERVICE_KEY:}
app.ai.admin-key=${AI_ADMIN_KEY:}
app.ai.daily-limit=${AI_DAILY_LIMIT:30}
app.ai.minute-limit=${AI_MINUTE_LIMIT:5}
