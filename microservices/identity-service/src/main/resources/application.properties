spring.application.name=identity-service
server.port=8084
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/identity_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
server.error.include-message=never

auth.jwt-secret=${JWT_SECRET}
demo.teacher-email=${DEMO_TEACHER_EMAIL:}
demo.teacher-password=${DEMO_TEACHER_PASSWORD:}
demo.admin-email=${DEMO_ADMIN_EMAIL:}
demo.admin-password=${DEMO_ADMIN_PASSWORD:}
