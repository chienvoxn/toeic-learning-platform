spring.application.name=assessment-service
server.port=8086
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/assessment_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
server.error.include-message=never

auth.jwt-secret=${JWT_SECRET}
services.internal-key=${INTERNAL_SERVICE_KEY}
services.content-url=${CONTENT_URL:http://localhost:8085}
services.membership-url=${MEMBERSHIP_URL:http://localhost:8082}
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBIT_USER:toeic}
spring.rabbitmq.password=${RABBIT_PASSWORD}
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
