events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  upstream identity { server identity-service:8084; }
  upstream content { server content-service:8085; }
  upstream assessment { server assessment-service:8086; }
  upstream membership { server membership-service:8082; }
  upstream interaction { server interaction-service:8083; }
  server {
    listen 8088; server_tokens off; client_max_body_size 2m;
    root /usr/share/nginx/html; index index.html;
    location ^~ /ms/v1/contents/quizzes/internal/ { return 404; }
    location ^~ /api/v1/memberships/internal/ { return 404; }
    location /ms/v1/identity/ { proxy_pass http://identity; include /etc/nginx/proxy_params; }
    location /ms/v1/contents/ { proxy_pass http://content; include /etc/nginx/proxy_params; }
    location /ms/v1/attempts { proxy_pass http://assessment; include /etc/nginx/proxy_params; }
    location /api/v1/memberships/ { proxy_pass http://membership; include /etc/nginx/proxy_params; }
    location /api/v1/interactions/ { proxy_pass http://interaction; include /etc/nginx/proxy_params; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
