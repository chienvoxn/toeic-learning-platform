services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: toeic_ai
      POSTGRES_USER: toeic_ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toeic_ai -d toeic_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ai_pgdata:
